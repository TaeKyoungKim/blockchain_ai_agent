[project]
name = "real-estate-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GaryKim", email = "moduedu@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
real-estate-ai-agent = "real_estate_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
